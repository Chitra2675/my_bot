amcl:
  ros__parameters:
    use_sim_time: true

    # Frames
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    # Motion model (FIXED)
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Laser
    scan_topic: scan
    laser_min_range: 0.3
    laser_max_range: 12.0
    max_beams: 60
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Noise parameters
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    update_min_d: 0.25
    update_min_a: 0.2

    # Beam skipping (disabled)
    do_beamskip: false

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0


amcl_map_client:
  ros__parameters:
    use_sim_time: true


amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true


bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: navigate_w_replanning_and_recovery.xml


bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.26
      max_vel_theta: 1.0
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


local_costmap_client:
  ros__parameters:
    use_sim_time: true


local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


global_costmap_client:
  ros__parameters:
    use_sim_time: true


global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: true


planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      allow_unknown: true


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true


recoveries_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    recovery_plugins: ["spin", "back_up", "wait"]


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/chitrakaverappa/dev_ws/my_map_save.yaml


map_saver:
  ros__parameters:
    use_sim_time: true


robot_state_publisher:
  ros__parameters:
    use_sim_time: true
