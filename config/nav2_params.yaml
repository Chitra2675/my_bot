amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: chassis
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: scan

    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.3
    laser_model_type: likelihood_field

    max_beams: 60
    max_particles: 2000
    min_particles: 500

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    resample_interval: 1

    # ✅ FIXED FOR HUMBLE
    robot_model_type: nav2_amcl::DifferentialMotionModel

    save_pose_rate: 0.5
    sigma_hit: 0.2

    tf_broadcast: true
    transform_tolerance: 1.0

    update_min_a: 0.2
    update_min_d: 0.25

    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05


amcl_map_client:
  ros__parameters:
    use_sim_time: true


amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true


bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: chassis
    odom_topic: /odom
    default_bt_xml_filename: navigate_w_replanning_and_recovery.xml


bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.26
      max_vel_theta: 1.0
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      critics: ["RotateToGoal", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: chassis

      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: chassis

      resolution: 0.05
      robot_radius: 0.22

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      allow_unknown: true


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true


recoveries_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: chassis
    recovery_plugins: ["spin", "back_up", "wait"]


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /full/path/to/my_map_save.yaml


robot_state_publisher:
  ros__parameters:
    use_sim_time: true
